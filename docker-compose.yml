services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: casei
      POSTGRES_USER: casei
      POSTGRES_PASSWORD: casei
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casei -d casei"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
