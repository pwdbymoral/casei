name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: casei
          POSTGRES_PASSWORD: casei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casei -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://casei:casei@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.3.0
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        env:
          AUDIT_LOG: ${{ runner.temp }}/casei-pnpm-audit.log
        run: |
          set -o pipefail
          set +e
          pnpm audit --prod --audit-level=high --ignore-registry-errors 2>&1 | tee "$AUDIT_LOG"
          pipeline_statuses=("${PIPESTATUS[@]}")
          audit_status=${pipeline_statuses[0]}
          tee_status=${pipeline_statuses[1]}
          set -e

          # A non-zero status still blocks CI: it means pnpm received an audit
          # response containing an advisory (or another unexpected failure).
          if [ "$audit_status" -ne 0 ]; then
            exit "$audit_status"
          fi
          if [ "$tee_status" -ne 0 ]; then
            echo "::error title=Production dependency audit failed::The audit output could not be captured."
            exit "$tee_status"
          fi

          # A normal successful pnpm audit always includes its vulnerability
          # summary. Anything else with status 0 is the documented
          # --ignore-registry-errors path (for example a timeout or HTTP error).
          if rg -qi '(No known vulnerabilities found|vulnerabilities found)' "$AUDIT_LOG"; then
            echo "Production dependency audit completed successfully: no high/critical advisories reported."
          else
            echo "::warning title=Production dependency audit inconclusive::The npm registry returned an error or timed out. pnpm --ignore-registry-errors intentionally returned 0; this run is not evidence that dependencies are vulnerability-free. Re-run when the registry is available."
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
